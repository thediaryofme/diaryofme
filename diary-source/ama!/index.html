    <section class="info-grid" aria-label="Questions I've been asked">
      <figure class="info-ama">
        <p class="info-copy" style="font-size: 1rem;">Here are some questions people have asked me.</p>
        <p class="info-copy" style="font-size: 1.1rem;">Q: why did you make this site?</p>
        <p class="info-copy" style="font-size: .9rem;">A: i really wanted my own aesthetic space that isn't monetized the way most of the web is. i never rly had a personal space where i could fully control who i let in yk.</p>
        <p class="info-copy" style="font-size: 1.1rem;">Q: who signed your home page?</p> 
        <p class="info-copy" style="font-size: .9rem;">A: my childhood bestie! we met in fifth grade, fought through a ton of stuff, and now study computer science together. she's my twin :)</p>
        <p class="info-copy" style="font-size: 1.1rem;">Q: what's your personality type?</p>
        <p class="info-copy" style="font-size: .9rem;">A: i'm an enfp! im quite extroverted and love hanging out with friends and doing random things for fun. i do need solo time to recharge tho.</p>
        <p class="info-copy" style="font-size: 1.1rem;">Q: what's your native language?</p>
        <p class="info-copy" style="font-size: .9rem;">A: i speak marathi at home. im not rly good at reading tho, i haven't read in ages lol.</p>
        <p class="info-copy" style="font-size: 1.1rem;">Q: what's your favorite taylor swift song?</p>
        <p class="info-copy" style="font-size: .9rem;">A: her older ones. i especially love style, love story, and enchanted. (fun fact: this domain happens to be one of her unreleased songs!)</p>
        <p class="info-copy" style="font-size: 1.1rem;">Q: what's your favorite color?</p>
        <p class="info-copy" style="font-size: .9rem;">A: muted blush. it's so soft and relaxing. i can literally look at it for hours on end. but honestly, i love any muted pastel.</p>
        <p class="info-copy" style="font-size: 1.1rem;">Q: what was the hardest part of making this site?</p>
        <p class="info-copy" style="font-size: .9rem;">A: the aesthetic. i found it quite challenging (and fun!) to add a touch of personality to my design. i could never rly tell if anything would look cute until i felt it.</p>
        <p class="info-copy" style="font-size: 1.1rem;">Q: can i use something on this site?</p>
        <p class="info-copy" style="font-size: .9rem;">A: sure! check the <a href="../license/">license</a> for more information.</p>
