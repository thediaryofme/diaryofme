<!DOCTYPE html>
<html lang="en" data-theme="blush">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#E2B59A">
  <meta name="description" content="did i sign this?">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; media-src 'none'; child-src 'none'; base-uri 'none'; form-action 'self'">
  <title>my signature</title>
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/icon.svg">
  <link rel="apple-touch-icon" href="../assets/icons/icon.svg">
  <link rel="preload" as="font" type="font/woff2" href="../assets/fonts/font.woff2" crossorigin>
  <link rel="stylesheet" href="../assets/style/site.css">
  <script src="../assets/style/theme.js"></script>
  <script defer src="../assets/worker/pwa.js" data-site-root="../"></script>
  <script defer src="../assets/core/client.js"></script>
  <script defer src="../assets/core/ui.js"></script>
  <script defer src="../assets/core/utils.js"></script>
  <script defer src="./verify.js"></script>
</head>
<body class="info-page">
  <main>
    <h1>my identity</h1>

    <section class="info-grid" aria-label="Verify me intro">
      <figure>
        <div class="info-list">
          <div class="info-item">
            <p class="info-copy">If you want to know if someone is <i>really</i> me, I can sign some text and send it to you to prove my identity. Upload the signature here to check it. The signed text will automatically show up. </p>
            <p class="info-copy">Note: i usually use instant links, this is just a last resort.</p>

          </div>
        </div>
      </figure>
    </section>

    <section class="home-section verify-section" aria-label="Identity verification">
      <h2 id="verify-heading" class="section-heading">is it me?</h2>
      <textarea
        id="verify-message"
        class="verify-input tools-textarea"
        rows="1"
        aria-label="signed text"
        readonly
        aria-readonly="true"
        autocomplete="off"
        spellcheck="false"
      ></textarea>
      <div class="verify-grid verify-grid-single">
        <label class="verify-upload" for="verify-signature">
          <input class="verify-upload-input" id="verify-signature" type="file" accept=".tsig" aria-label="upload the signature file">
          <span class="verify-upload-label">upload signature</span>
        </label>
      </div>
      <button id="verify-submit" class="verify-submit" type="button">verify</button>
    </section>
  </main>
</body>
</html>
